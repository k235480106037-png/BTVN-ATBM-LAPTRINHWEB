# 1. Website 1 (s1.kiennguyen1404.id.vn) & API Node-RED
server {
    listen 80;
    server_name s1.kiennguyen1404.id.vn kiennguyen1404.id.vn site1.kiennguyen1404.id.vn site1.local;

    location / {
        root /usr/share/nginx/html/site1;
        index index.html index.htm;
    }

    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }
}

# 2. Website 2 (s2.kiennguyen1404.id.vn)
server {
    listen 80;
    server_name s2.kiennguyen1404.id.vn site2.kiennguyen1404.id.vn site2.local;

    location / {
        root /usr/share/nginx/html/site2;
        index index.html index.htm;
    }
}
